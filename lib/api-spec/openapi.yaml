        observacoes: { type: string }
        ativo: { type: boolean }
        courseId: { type: ["integer", "null"] }

    CursoInscricaoBulkDeleteInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: integer, minimum: 1 }

    CursoInscricaoBulkDeleteResult:
      type: object
      required: [deletedCount]
      properties:
        deletedCount: { type: integer, minimum: 0 }

    CursoInscricaoTestCascadeDeleteInput:
      type: object
      required: [ids, confirmation]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        confirmation: { type: string, minLength: 1, maxLength: 100 }

    CursoInscricaoTestCascadeDeleteResult:
      type: object
      required: [deletedEventCount, deletedClassCount, deletedCourseCount, deletedEnrollmentCount]
      properties:
        deletedEventCount: { type: integer, minimum: 0 }
        deletedClassCount: { type: integer, minimum: 0 }
        deletedCourseCount: { type: integer, minimum: 0 }
        deletedEnrollmentCount: { type: integer, minimum: 0 }

    CursoInscrito:
      type: object
      required: [pessoaId, nome, inscritoEm]
      properties:
        pessoaId: { type: integer }
        nome: { type: string }
        sobrenome: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        celular: { type: ["string", "null"] }
        inscritoEm: { type: string, format: date-time }

    CursoInscricaoInscritos:
      type: object
      required: [count, inscritos]
      properties:
        count: { type: integer }
        inscritos:
          type: array
          items:
            $ref: "#/components/schemas/CursoInscrito"

    PessoaLookupResult:
