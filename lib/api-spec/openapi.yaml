      responses:
        "200":
          description: Completed enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormalizationResult" }
components:
  schemas:
    EventPaymentSummary:
      type: object
      required: [id, amount, reference, confirmedAt, confirmedBy, expiresAt, completedAt, revokedAt]
      properties:
        id: { type: integer }
        amount: { type: string }
        reference: { type: string }
        confirmedAt: { type: string, format: date-time }
        confirmedBy: { type: integer }
        expiresAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
    EventParticipant:
      type: object
      required: [id, pessoaId, status, nome, latestAnswers, formalizacao]
      properties:
        id: { type: integer }
        pessoaId: { type: integer }
        status: { type: string, enum: [INTERESSADO, PREINSCRITO, MATRICULADO] }
        nome: { type: string }
        sobrenome: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        celular: { type: ["string", "null"] }
        latestAnswers: { type: object, additionalProperties: true }
        formalizacao:
          allOf: [{ $ref: "#/components/schemas/EventPaymentSummary" }]
          nullable: true
    EventParticipants:
      type: object
      required: [event, interessados, preinscritos, matriculados]
      properties:
        event: { type: object, additionalProperties: true }
        interessados: { type: array, items: { $ref: "#/components/schemas/EventParticipant" } }
        preinscritos: { type: array, items: { $ref: "#/components/schemas/EventParticipant" } }
        matriculados:
          type: array
          items:
            type: object
            required: [enrollmentId, pessoaId, classId, price, paymentStatus, contractStatus, nome]
            properties:
              enrollmentId: { type: integer }
              pessoaId: { type: integer }
              classId: { type: integer }
              price: { type: number }
              paymentStatus: { type: string }
              contractStatus: { type: string }
              nome: { type: string }
              sobrenome: { type: ["string", "null"] }
    EventPaymentInput:
      type: object
      additionalProperties: false
      required: [amount, reference]
      properties:
        amount: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
        reference: { type: string, minLength: 1, maxLength: 300 }
    FormalizationLink:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
    FormalizationAnswers:
      type: object
      additionalProperties: false
      required: [respostas]
      properties:
        respostas: { type: object, additionalProperties: { type: string } }
    FormalizationResult:
      type: object
      required: [success, enrollmentId]
      properties:
        success: { type: boolean }
        enrollmentId: { type: integer }
        alreadyCompleted: { type: boolean }
    PublicFormalization:
      type: object
      required: [status, evento, campos, expiresAt]
      properties:
        status: { type: string, enum: [pending, completed] }
        evento:
          type: object
          required: [nome]
          properties:
            nome: { type: string }
        campos:
          type: array
          items:
            type: object
            required: [key, label, type]
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string }
              required: { type: boolean }
              active: { type: boolean }
              options: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time }
    OpportunityStage:
      type: string
      enum: [NEW_INTEREST, CONTACT_STARTED, QUALIFYING, PATH_IDENTIFIED, DECIDING, ENROLLMENT_RESERVATION_IN_PROGRESS, CONFIRMED, NURTURE, CLOSED]
    OpportunityNucleus:
      type: string
      enum: [EDUCATION, EXPERIENCES]
    OpportunityTaskType:
      type: string
      enum: [CALL, WHATSAPP, EMAIL, MEETING, INTERNAL, NONE]
    ContactStatus:
      type: string
      enum: [NOT_STARTED, ATTEMPTED, REACHED, UNREACHABLE, OPTED_OUT]
    OfferInterestStatus:
      type: string
      enum: [UNKNOWN, INTERESTED, NOT_INTERESTED]
    EligibilityStatus:
      type: string
      enum: [UNKNOWN, ELIGIBLE, INELIGIBLE, HUMAN_REVIEW]
    CommercialOpportunity:
      type: object
      required: [id, pessoaId, nucleus, offerIdentity, stage, contactStatus, stageEnteredAt, offerInterestStatus, eligibilityStatus, source, version, createdAt, updatedAt]
      properties:
        id: { type: integer }
        pessoaId: { type: integer }
        nucleus: { $ref: "#/components/schemas/OpportunityNucleus" }
        cursosInscricaoId: { type: ["integer", "null"] }
        offerLabel: { type: ["string", "null"] }
        offerIdentity: { type: string }
        ownerUserId: { type: ["integer", "null"] }
        ownerSystem: { type: ["string", "null"], enum: [SOFIA, null] }
        stage: { $ref: "#/components/schemas/OpportunityStage" }
        contactStatus: { $ref: "#/components/schemas/ContactStatus" }
        nextTaskType: { allOf: [{ $ref: "#/components/schemas/OpportunityTaskType" }], nullable: true }
        nextTaskText: { type: ["string", "null"] }
        nextTaskAt: { type: ["string", "null"], format: date-time }
        stageEnteredAt: { type: string, format: date-time }
        lastInteractionAt: { type: ["string", "null"], format: date-time }
        offerInterestStatus: { $ref: "#/components/schemas/OfferInterestStatus" }
        eligibilityStatus: { $ref: "#/components/schemas/EligibilityStatus" }
        nextBestAction: { type: ["string", "null"] }
        decisionRunId: { type: ["integer", "null"] }
        humanCaseReference: { type: ["string", "null"] }
        pauseReason: { type: ["string", "null"] }
        closeReason: { type: ["string", "null"] }
        informacoes: { type: ["string", "null"], description: "Editable free-text information about the card" }
        source: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        person:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: ["string", "null"] }
            phone: { type: ["string", "null"] }
        owner:
          type: ["object", "null"]
          required: [id, name, role]
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
            role: { type: string }
        origem:
          type: object
          required: [grupo, grupoLabel, curso, evento]
          properties:
            grupo: { type: ["string", "null"] }
            grupoLabel: { type: ["string", "null"] }
            curso:
              type: ["object", "null"]
              required: [id, name]
              properties: { id: { type: integer }, name: { type: string } }
            evento:
              type: ["object", "null"]
              required: [id, name]
              properties: { id: { type: integer }, name: { type: string } }
        sofia:
          type: object
          required: [eligibilityStatus, nextBestAction, decisionRunId, handoffActive]
          properties:
            eligibilityStatus: { $ref: "#/components/schemas/EligibilityStatus" }
            nextBestAction: { type: ["string", "null"] }
            decisionRunId: { type: ["integer", "null"] }
            handoffActive: { type: boolean }
    CommercialFilterOptions:
      type: object
      required: [grupos, cursos, eventos]
      properties:
        grupos:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: ["string", "null"] }
        cursos:
          type: array
          items:
            type: object
            required: [id, name]
            properties: { id: { type: integer }, name: { type: string } }
        eventos:
          type: array
          items:
            type: object
            required: [id, name, cursoId]
            properties:
              id: { type: integer }
              name: { type: string }
              cursoId: { type: ["integer", "null"] }
    CommercialNote:
      type: object
      required: [id, text, authorUserId, createdAt]
      properties:
        id: { type: integer }
        text: { type: string }
        authorUserId: { type: integer }
        authorName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    CommercialTask:
      type: object
      required: [id, text, createdAt]
      properties:
        id: { type: integer }
        text: { type: string }
        dueAt: { type: ["string", "null"], format: date-time }
        doneAt: { type: ["string", "null"], format: date-time }
        doneByUserId: { type: ["integer", "null"] }
        doneByName: { type: ["string", "null"] }
        createdByUserId: { type: integer }
        createdByName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    CommercialTaskInput:
      type: object
      required: [texto]
      properties:
        texto: { type: string }
        prazo: { type: ["string", "null"] }
    CommercialAppointment:
      type: object
      required: [id, title, startsAt]
      properties:
        id: { type: integer }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        link: { type: ["string", "null"] }
        createdByUserId: { type: integer }
        createdByName: { type: ["string", "null"] }
    CommercialAppointmentInput:
      type: object
      required: [titulo, dataHora]
      properties:
        titulo: { type: string }
        dataHora: { type: string }
        link: { type: ["string", "null"] }
    CommercialAtendimento:
      type: object
      required: [informacoes, notas, tarefas, compromissos]
      properties:
        informacoes: { type: ["string", "null"] }
        notas:
          type: array
          items: { $ref: "#/components/schemas/CommercialNote" }
        tarefas:
          type: array
          items: { $ref: "#/components/schemas/CommercialTask" }
        compromissos:
          type: array
          items: { $ref: "#/components/schemas/CommercialAppointment" }
    ContactRegistration:
      type: object
      required: [id, kind, origem, registradoPorUserId, registradoPeloSistema, createdAt]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [AUTORIZOU, NAO_QUER_RECEBER, NAO_QUER_RECEBER_DESFEITO] }
        origem: { type: string, enum: [FORMULARIO, CONVERSA_WHATSAPP, PRESENCIAL, OUTRO] }
        origemTexto: { type: ["string", "null"] }
        registradoPorUserId: { type: ["integer", "null"], description: "Null when the system recorded it (form consent, Sofia)" }
        registradoPeloSistema: { type: boolean, description: "True when recorded by the form or by Sofia, not by a staff member" }
        registradoPorNome: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    ContactState:
      type: object
      required: [autorizado, naoQuerReceber, registros]
      properties:
        autorizado: { type: boolean }
        naoQuerReceber: { type: boolean, description: "Always wins over the authorization" }
        registros:
          type: array
          description: Newest first
          items: { $ref: "#/components/schemas/ContactRegistration" }
    ContactRegistrationInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [AUTORIZOU, NAO_QUER_RECEBER, NAO_QUER_RECEBER_DESFEITO] }
        origem: { type: string, enum: [FORMULARIO, CONVERSA_WHATSAPP, PRESENCIAL, OUTRO] }
        origemTexto: { type: ["string", "null"] }
    ConversationLink:
      type: object
      required: [tipo]
      properties:
        tipo: { type: string, enum: [vinculada, a_confirmar, nenhuma, bloqueada] }
        conversationId: { type: integer }
        motivo: { type: string, enum: [telefone_em_varias_fichas, conversa_de_outra_ficha, sem_telefone, telefone_invalido, telefone_estrangeiro] }
    PessoaWhatsappConversation:
      type: object
      required: [pessoaId, vinculo, conversa, mensagens]
      properties:
        pessoaId: { type: integer }
        vinculo: { $ref: "#/components/schemas/ConversationLink" }
        conversa:
          type: ["object", "null"]
          required: [id, status]
          properties: { id: { type: integer }, status: { type: string } }
        mensagens:
          type: array
          items: { $ref: "#/components/schemas/Message" }
    CommercialChatStatus:
      type: object
      required: [conversationId, status]
      properties:
        conversationId: { type: integer }
        status: { type: string }
    SharedPhonePessoa:
      type: object
      required: [id, codigo, nome]
      properties:
        id: { type: integer }
        codigo: { type: string }
        nome: { type: string }
        sobrenome: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        celular: { type: ["string", "null"] }
    CommercialChat:
      type: object
      required: [pessoaId, vinculo, conversa, mensagens, janelaAte, janelaAberta, contato, podeEnviarTexto, bloqueiosDeTexto, fichasComMesmoTelefone, celularInformadoNaoGravado]
      properties:
        pessoaId: { type: integer }
        vinculo: { $ref: "#/components/schemas/ConversationLink" }
        fichasComMesmoTelefone:
          type: array
          description: Active fichas that share the phone, only filled when the link is blocked with telefone_em_varias_fichas (empty otherwise)
          items: { $ref: "#/components/schemas/SharedPhonePessoa" }
        celularInformadoNaoGravado:
          type: boolean
          description: Only true when the ficha has no phone and a public form reported a phone that was not saved because it belongs to other fichas
        conversa:
          type: ["object", "null"]
          required: [id, status]
          properties: { id: { type: integer }, status: { type: string } }
        mensagens:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        janelaAte: { type: ["string", "null"], format: date-time, description: "End of the 24h window counted from the person's last message" }
        janelaAberta: { type: boolean }
        contato:
          type: object
          required: [autorizado, naoQuerReceber]
          properties: { autorizado: { type: boolean }, naoQuerReceber: { type: boolean } }
        podeEnviarTexto: { type: boolean }
        bloqueiosDeTexto:
          type: array
          items:
            type: string
            enum: [sem_conversa, vinculo_a_confirmar, conversa_bloqueada, atendimento_nao_assumido, janela_fechada, nao_quer_receber, cartao_encerrado]
    OpeningTemplatePreview:
      type: object
      required: [podeEnviar, bloqueios, texto, vinculo, celularInformadoNaoGravado]
      properties:
        podeEnviar: { type: boolean }
        bloqueios:
          type: array
          items:
            type: string
            enum:
              - pessoa_arquivada
              - pessoa_unida
              - sem_primeiro_nome
              - sem_telefone
              - telefone_invalido
              - telefone_estrangeiro
              - telefone_em_varias_fichas
              - sem_autorizacao
              - nao_quer_receber
              - cartao_nao_quer_receber
              - vinculo_a_confirmar
              - conversa_de_outra_ficha
              - modelo_em_analise
              - modelo_nao_aprovado
              - modelo_inexistente
              - modelo_indisponivel
              - modelo_incompativel
        texto: { type: ["string", "null"], description: "Exact text the person will receive" }
        vinculo: { $ref: "#/components/schemas/ConversationLink" }
        celularInformadoNaoGravado:
          type: boolean
          description: Only true when the ficha has no phone and a public form reported a phone that was not saved because it belongs to other fichas
    OpeningTemplateSent:
      type: object
      required: [conversationId, messageId, texto]
      properties:
        conversationId: { type: integer }
        messageId: { type: integer }
        texto: { type: string }
    CommercialConfirmationOption:
      type: object
      required: [kind, label]
      properties:
        kind: { type: string, enum: [ENROLLMENT, EXPERIENCE_REGISTRATION, HUMAN_ADMIN] }
        id: { type: integer }
        label: { type: string }
    CommercialConfirmationOptions:
      type: object
      required: [opportunityId, options]
      properties:
        opportunityId: { type: integer }
        options:
          type: array
          items: { $ref: "#/components/schemas/CommercialConfirmationOption" }
    CommercialOwner:
      type: object
      required: [id, name, email, profileName]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        profileName: { type: string }
    CommercialOpportunityEvent:
      type: object
      required: [id, opportunityId, actorKind, eventType, source, idempotencyKey, createdAt]
      properties:
        id: { type: integer }
        opportunityId: { type: integer }
        actorKind: { type: string, enum: [HUMAN, SOFIA, SYSTEM] }
        actorId: { type: ["integer", "null"] }
        actorName: { type: ["string", "null"], description: "Name of the staff member who acted (also on old entries)" }
        fromStage: { allOf: [{ $ref: "#/components/schemas/OpportunityStage" }], nullable: true }
        toStage: { allOf: [{ $ref: "#/components/schemas/OpportunityStage" }], nullable: true }
        eventType: { type: string }
        reason: { type: ["string", "null"] }
        source: { type: string }
        idempotencyKey: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    CommercialOpportunityDetail:
      type: object
      required: [opportunity, events]
      properties:
        opportunity: { $ref: "#/components/schemas/CommercialOpportunity" }
        events:
          type: array
          items: { $ref: "#/components/schemas/CommercialOpportunityEvent" }
    CreateCommercialOpportunityInput:
      type: object
      additionalProperties: false
      required: [pessoaId, nucleus, nextTaskType, nextTaskText, nextTaskAt]
      properties:
        pessoaId: { type: integer }
        nucleus: { $ref: "#/components/schemas/OpportunityNucleus" }
        cursosInscricaoId: { type: integer }
        offerLabel: { type: string }
        ownerUserId: { type: integer }
        nextTaskType: { $ref: "#/components/schemas/OpportunityTaskType" }
        nextTaskText: { type: string, minLength: 1 }
        nextTaskAt: { type: string, format: date-time }
        source: { type: string }
        idempotencyKey: { type: string }
    UpdateCommercialOpportunityInput:
      type: object
      additionalProperties: false
      properties:
        ownerUserId: { type: ["integer", "null"] }
        contactStatus: { $ref: "#/components/schemas/ContactStatus" }
        nextTaskType: { $ref: "#/components/schemas/OpportunityTaskType" }
        nextTaskText: { type: ["string", "null"] }
        nextTaskAt: { type: ["string", "null"], format: date-time }
        offerInterestStatus: { $ref: "#/components/schemas/OfferInterestStatus" }
        expectedVersion: { type: integer }
        source: { type: string }
        idempotencyKey: { type: string }
    CompleteOpportunityTaskInput:
      type: object
      additionalProperties: false
      required: [nextTaskType, nextTaskText, nextTaskAt]
      properties:
        nextTaskType: { type: string, enum: [CALL, WHATSAPP, EMAIL, MEETING, INTERNAL] }
        nextTaskText: { type: string, minLength: 1 }
        nextTaskAt: { type: string, format: date-time }
        source: { type: string }
        idempotencyKey: { type: string }
        expectedVersion: { type: integer }
    OpportunityTransitionInput:
      type: object
      additionalProperties: false
      required: [toStage]
      properties:
        toStage: { $ref: "#/components/schemas/OpportunityStage" }
        reason: { type: string }
        source: { type: string }
        idempotencyKey: { type: string }
        expectedVersion: { type: integer }
        confirmation:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, enrollmentId]
              properties:
                kind: { type: string, enum: [ENROLLMENT] }
                enrollmentId: { type: integer }
            - type: object
              additionalProperties: false
              required: [kind, registrationId]
              properties:
                kind: { type: string, enum: [EXPERIENCE_REGISTRATION] }
                registrationId: { type: integer }
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, enum: [HUMAN_ADMIN] }
    OpportunityReasonInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
        source: { type: string }
        idempotencyKey: { type: string }
    EducationEventSummaryResponse:
      type: object
      required: [rows, totals, filters]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/EducationEventSummaryRow" }
        totals: { $ref: "#/components/schemas/EducationEventSummaryTotals" }
        filters: { $ref: "#/components/schemas/EducationEventSummaryFilters" }
    EducationEventSummaryRow:
      type: object
      required: [eventId, eventName, eventType, active, enrolled, available, contracted, paid, outstanding, paidPercent]
      properties:
        eventId: { type: integer }
        eventName: { type: string }
        eventType: { type: string }
        active: { type: boolean }
        startDate: { type: ["string", "null"] }
        endDate: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        classId: { type: ["integer", "null"] }
        classCode: { type: ["string", "null"] }
        courseId: { type: ["integer", "null"] }
        courseName: { type: ["string", "null"] }
        capacity: { type: ["integer", "null"] }
        enrolled: { type: integer }
        available: { type: ["integer", "null"] }
        contracted: { type: number }
        paid: { type: number }
        outstanding: { type: number }
        paidPercent: { type: ["number", "null"] }
    EducationEventSummaryTotals:
      type: object
      required: [events, enrolled, available, contracted, paid, outstanding, paidPercent]
      properties:
        events: { type: integer }
        enrolled: { type: integer }
        available: { type: integer }
        contracted: { type: number }
        paid: { type: number }
        outstanding: { type: number }
        paidPercent: { type: ["number", "null"] }
    EducationEventSummaryFilters:
      type: object
      required: [years, eventTypes, courses, cities]
      properties:
        years: { type: array, items: { type: integer } }
        eventTypes: { type: array, items: { type: string } }
        courses: { type: array, items: { type: string } }
        cities: { type: array, items: { type: string } }
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    # ── Dashboard ─────────────────────────────────────────────
    DashboardKpis:
      type: object
      required:
        - totalRevenue
        - totalRevenueEducation
        - totalRevenueStore
        - totalExpenses
        - totalExpensesEducation
        - totalExpensesStore
        - newQualifiedContacts
        - openConversations
        - storeOrdersCurrentMonth
        - storeOrdersPreviousMonth
        - storeOrdersCollectedAt
      properties:
        totalRevenue: { type: number }
        totalRevenueEducation: { type: number }
        totalRevenueStore: { type: number }
        totalExpenses: { type: number }
        totalExpensesEducation: { type: number }
        totalExpensesStore: { type: number }
        totalRevenueChange: { type: ["number", "null"] }
        newQualifiedContacts: { type: integer }
        newContactsChange: { type: number }
        openConversations: { type: integer }
        openConversationsChange: { type: number }
        activeOffers: { type: integer }
        storeOrdersCurrentMonth: { type: ["integer", "null"] }
        storeOrdersPreviousMonth: { type: ["integer", "null"] }
        storeOrdersCollectedAt: { type: ["string", "null"], format: date-time }

    ChartPoint:
      type: object
      required: [month, education, store, experiences, creation]
      properties:
        month: { type: string }
        education: { type: number }
        store: { type: number }
        experiences: { type: number }
        creation: { type: number }

    Alert:
      type: object
      required: [id, icon, text, color]
      properties:
        id: { type: integer }
        icon: { type: string }
        text: { type: string }
        color: { type: string }

    FinanceSummary:
      type: object
      required: [revenueNoShipping, costPrice, markup, taxes, saleRate, profit]
      properties:
        omieStatus:
          type: string
          enum: [ok, timeout, error]
          description: Indicates whether Omie data is real ("ok") or a zero fallback due to a timeout or error.
        avisos:
          type: array
          description: Notices about the Omie titles behind these totals, e.g. titles with an unknown status left out of them. Absent when there is nothing to report.
          items: { type: string }
        revenueNoShipping: { type: number }
        revenueNoShippingChange: { type: number }
        costPrice: { type: number }
        costPriceChange: { type: number }
        markup: { type: number }
        markupChange: { type: number }
        taxes: { type: number }
        taxesChange: { type: number }
        saleRate: { type: number }
        saleRateChange: { type: number }
        profit: { type: number }
        profitChange: { type: number }
        goalBaseline: { type: number }
        goalTarget: { type: number }
        leadGrowth:
          type: array
          items:
            type: object
            required: [day, leads]
            properties:
              day: { type: string, format: date }
              leads: { type: integer }
        revenueByVertical:
          type: array
          items:
            $ref: "#/components/schemas/VerticalRevenue"

    DashboardSnapshotPayload:
      type: object
      required: [kpis, ordersChart, alerts, financeSummary, peopleAnalytics]
      properties:
        kpis:
          $ref: "#/components/schemas/DashboardKpis"
        ordersChart:
          type: array
          items:
            $ref: "#/components/schemas/ChartPoint"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        financeSummary:
          $ref: "#/components/schemas/FinanceSummary"
        peopleAnalytics:
          $ref: "#/components/schemas/PeopleAnalytics"

    PeopleAnalytics:
      type: object
      required: [totalPeople, sex, cities, states, referralSources]
      properties:
        totalPeople: { type: integer }
        sex:
          $ref: "#/components/schemas/PeopleDistribution"
        cities:
          $ref: "#/components/schemas/PeopleDistribution"
        states:
          $ref: "#/components/schemas/PeopleDistribution"
        referralSources:
          $ref: "#/components/schemas/PeopleDistribution"

    PeopleDistribution:
      type: object
      required: [totalCount, filledCount, missingCount, missingPercentage, items]
      properties:
        totalCount: { type: integer }
        filledCount: { type: integer }
        missingCount: { type: integer }
        missingPercentage: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PeopleDistributionItem"

    PeopleDistributionItem:
      type: object
      required: [label, count, percentage]
      properties:
        label: { type: string }
        count: { type: integer }
        percentage: { type: number }

    DashboardSnapshot:
      type: object
      required: [status, schemaVersion, data, collectedAt, lastAttemptedAt, lastError]
      properties:
        status:
          type: string
          enum: [empty, ready, refreshing, error]
        schemaVersion:
          type: integer
        data:
          anyOf:
            - $ref: "#/components/schemas/DashboardSnapshotPayload"
            - type: "null"
        collectedAt:
          type: ["string", "null"]
          format: date-time
        lastAttemptedAt:
          type: ["string", "null"]
          format: date-time
        lastError:
          type: ["string", "null"]

    VerticalRevenue:
      type: object
      required: [label, value, total, color]
      properties:
        label: { type: string }
        value: { type: number }
        total: { type: number }
        color: { type: string }

    CommercialPipeline:
      type: object
      required: [totalLeads, qualifiedLeads, avgFirstContactMin, avgTicket, byCourse, byStage]
      properties:
        totalLeads: { type: integer }
        qualifiedLeads: { type: integer }
        avgFirstContactMin: { type: number }
        avgTicket: { type: number }
        byCourse:
          type: array
          items:
            $ref: "#/components/schemas/FunnelSegment"
        byStage:
          type: array
          items:
            $ref: "#/components/schemas/FunnelSegment"

    FunnelSegment:
      type: object
      required: [label, value, color]
      properties:
        label: { type: string }
        value: { type: integer }
        color: { type: string }

    # ── Store ──────────────────────────────────────────────────
    StoreSituation:
      type: string
      enum: [paid_delivered, paid_to_ship, awaiting_payment, declined, refunded, cancelled]

    StorePanelStatus:
      type: object
      required: [status, schemaVersion, collectedAt, lastAttemptedAt, lastError, lastErrorCode]
      properties:
        status:
          type: string
          enum: [empty, ready, refreshing, error]
        schemaVersion: { type: integer }
        collectedAt:
          type: ["string", "null"]
          format: date-time
        lastAttemptedAt:
          type: ["string", "null"]
          format: date-time
        lastError:
          type: ["string", "null"]
        lastErrorCode:
          type: ["string", "null"]

