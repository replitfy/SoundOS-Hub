            sobrenome: { type: ["string", "null"] }
            email: { type: ["string", "null"] }
            celular: { type: ["string", "null"] }
            sexo: { type: ["string", "null"] }
            cidade: { type: ["string", "null"] }
            estadoUf: { type: ["string", "null"] }
            profissao: { type: ["string", "null"] }
            comoFicouSabendo: { type: ["string", "null"] }
            qualAmigoParceiro: { type: ["string", "null"] }
            conectadoProposito: { type: ["string", "null"] }
            lugarMusicaSom: { type: ["string", "null"] }
            participouTrabalhoSom: { type: ["string", "null"] }
            qualTrabalhoSom: { type: ["string", "null"] }
            buscaEspiritual: { type: ["string", "null"] }
            formacaoMusicaTerapia: { type: ["string", "null"] }
            outroCurso: { type: ["string", "null"] }
            terapeuta: { type: ["string", "null"] }
            objetivoCurso: { type: ["string", "null"] }
            intencaoPrincipal: { type: ["string", "null"] }
            cursoExpectativas: { type: ["string", "null"] }
            servicoInteresse: { type: ["string", "null"] }

    PublicInscricaoPayload:
      type: object
      required: [nome, sobrenome, email, celular, sexo, dataNascimento, profissao]
      properties:
        cursoSlug: { type: string }
        nome: { type: string }
        sobrenome: { type: string }
        email: { type: string }
        celular: { type: string }
        sexo: { type: string }
        profissao: { type: string }
        dataNascimento: { type: string }
        cpf: { type: string }
        enderecoRua: { type: string }
        cidade: { type: string }
        estadoUf: { type: string }
        cep: { type: string }
        comoFicouSabendo: { type: string }
        qualAmigoParceiro: { type: string }
        conectadoProposito: { type: string }
        lugarMusicaSom: { type: string }
        participouTrabalhoSom: { type: string }
        qualTrabalhoSom: { type: string }
        buscaEspiritual: { type: string }
        formacaoMusicaTerapia: { type: string }
        outroCurso: { type: string }
        terapeuta: { type: string }
