    InscricaoResult:
      type: object
      required: [success, pessoaId]
      properties:
        success: { type: boolean }
        pessoaId: { type: integer }
    SofiaEntity:
      type: object
      required: [id, entityType, stableKey, displayName, sourceTable, sourceId, approvedFacts, sensitive, reviewStatus, capabilities]
      properties:
        id: { type: integer }
        entityType: { type: string, enum: [offer, instrument_family, event] }
        stableKey: { type: string }
        displayName: { type: string }
        sourceTable: { type: string }
        sourceId: { type: integer }
        approvedFacts: { type: object, additionalProperties: true }
        runtimeAliases:
          type: array
          items: { type: string }
        sourceRefs:
          type: array
          items: { $ref: "#/components/schemas/SofiaSourceRef" }
        supersededByStableKey: { type: string, nullable: true }
        sensitive: { type: boolean }
        reviewStatus: { type: string, enum: [draft, approved, rejected] }
        capabilities: { type: object, additionalProperties: true }
    SofiaEntityUpdate:
      type: object
      additionalProperties: false
      properties:
        approvedFacts: { type: object, additionalProperties: true }
        sourceRefs:
          type: array
          items: { $ref: "#/components/schemas/SofiaSourceRef" }
        sensitive: { type: boolean }
        reviewStatus: { type: string, enum: [draft, approved, rejected] }
        capabilities: { type: object, additionalProperties: true }
    SofiaSourceRef:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, sourceType, ref, url, checkedAt, version, status, ingestedContentSha256, manifestRef, manifestLinkageStatus]
          properties:
            type: { type: string, enum: [controlled_document] }
            sourceType: { type: string, enum: [document] }
            ref: { type: string }
            url: { type: string, description: "URL ou caminho auditável da fonte ingerida." }
            checkedAt: { type: string, format: date-time }
            version: { type: string }
            status: { type: string, enum: [candidate, approved, published] }
            ingestedContentSha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
            manifestRef: { type: string, description: "Referência auditável ao manifesto recebido." }
            manifestLinkageStatus: { type: string, enum: [verified, unavailable_in_summary] }
            manifestSha256: { type: string, pattern: "^[a-fA-F0-9]{64}$" }
        - type: object
          additionalProperties: false
          required: [type, sourceType, ref, url, checkedAt, validUntil]
          properties:
            type: { type: string, enum: [official] }
            sourceType: { type: string, enum: [commercial] }
            ref: { type: string }
            url: { type: string }
            checkedAt: { type: string, format: date-time }
            validUntil: { type: string, format: date-time }
