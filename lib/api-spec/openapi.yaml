  /crm/opportunities/{id}/chat/mensagens:
    post:
      operationId: sendCommercialOpportunityChatMessage
      tags: [commercial]
      summary: Send a free-text WhatsApp message inside the 24h window (single attempt)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texto]
              properties:
                texto: { type: string }
      responses:
        "201":
          description: Accepted by the WhatsApp queue (not yet delivered)
          content:
            application/json:
              schema:
                type: object
                required: [messageId]
                properties:
                  messageId: { type: integer }
        "409": { description: "Not assumed, outside the 24h window, opted out, not linked or closed" }
        "502": { description: "WhatsApp refused the message (SEND_FAILED); nothing was resent" }
  /crm/opportunities/{id}/chat/anexos:
    post:
      operationId: sendCommercialOpportunityChatAttachment
      tags: [commercial]
      summary: Send one file (image, video, audio or document) inside the 24h window (single attempt)
      description: >-
        Same rules as free text (attendance assumed, 24h window, person did not opt out). The type is read from
        the file content; limits per type: image 5 MB, video 16 MB, audio 16 MB, document 100 MB. Audio takes no caption.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo: { type: string, format: binary }
                legenda: { type: string, description: "Optional caption (up to 1024 characters; not allowed for audio)" }
      responses:
        "201":
          description: Accepted by the WhatsApp queue (not yet delivered)
          content:
            application/json:
              schema:
                type: object
                required: [messageId, anexoId]
                properties:
                  messageId: { type: integer }
                  anexoId: { type: integer }
        "409": { description: "Not assumed, outside the 24h window, opted out, not linked or closed" }
        "413": { description: "File above the limit of its type (ATTACHMENT_TOO_LARGE)" }
        "422": { description: "Type not allowed, empty file, caption not allowed or too long" }
        "502": { description: "Storage or WhatsApp refused (ATTACHMENT_STORAGE_FAILED, SEND_FAILED); nothing was resent" }
