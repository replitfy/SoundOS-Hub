        handoffSummary:
          type: ["string", "null"]
          description: JSON serializado do resumo estruturado gerado no momento do handoff
        handoffTriggeredAt: { type: ["string", "null"] }
        handoffResolvedAt: { type: ["string", "null"] }
        handoffResolvedBy: { type: ["string", "null"] }
        canal:
          type: string
          enum: [interno, instagram, whatsapp]
          description: Canal de origem da conversa (interno = chat do SoundOS)
        canalUsuario: { type: ["string", "null"], description: "Contato no canal externo: @usuário sem o @ (Instagram) ou telefone só com dígitos e código do país (WhatsApp)" }
        ultimoEnvioFalhou:
          type: boolean
          description: A última resposta destinada ao contato no canal externo não foi entregue
        ultimoEnvioErro: { type: ["string", "null"] }
        primeiraMensagemEhArquivo:
          type: boolean
          description: A primeira mensagem da pessoa é um arquivo sem texto (firstMessage vem nulo)
        arquivosNaoVistos:
          type: integer
          description: Arquivos recebidos pelo WhatsApp que ninguém da equipe viu ainda
        primeiroArquivoNaoVistoEm:
          type: ["string", "null"]
          description: Quando chegou o arquivo não visto mais antigo (ISO 8601)
        cartaoAbertoId:
          type: ["integer", "null"]
          description: Cartão aberto do CRM da pessoa desta conversa (o mais recente), para o atalho
        createdAt: { type: string }

    AwaitingStaffConversation:
      type: object
      required: [id, title, canal, canalUsuario, waitingSince, arquivosNaoVistos]
      properties:
        id: { type: integer }
        title: { type: string }
        canal:
          type: string
          enum: [instagram, whatsapp]
        canalUsuario: { type: ["string", "null"] }
        waitingSince:
          type: string
          description: Quando a conversa passou a aguardar a equipe, ou chegou o primeiro arquivo não visto (ISO 8601)
        arquivosNaoVistos:
          type: integer
          description: Arquivos recebidos que ninguém da equipe viu ainda (0 quando o aviso é só do handoff)

    AwaitingStaffSummary:
      type: object
      required: [total, respostasNaoEntregues, oldestWaitingSince, conversations]
      properties:
        total:
          type: integer
          description: Quantas conversas aguardam a equipe agora (todas, não só as listadas)
        respostasNaoEntregues:
          type: integer
          description: >-
            Quantas conversas de canais externos têm a última resposta da Sofia não entregue (falha de envio).
            Contagem separada de `total`: sai sozinha quando um envio seguinte da conversa é registrado.
        oldestWaitingSince:
          type: ["string", "null"]
          description: Há quanto tempo espera a conversa mais antiga; nulo quando não há nenhuma
        conversations:
          type: array
          description: As mais recentes primeiro, no máximo 20
          items:
            $ref: "#/components/schemas/AwaitingStaffConversation"

    ConversationInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        model: { type: string }

    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        role: { type: string }
        content: { type: string }
        conduta:
          type: ["string", "null"]
          enum: [triagem, comercial, null]
          description: Conduta ativa da Sofia (Documento 14/15) quando esta mensagem foi produzida, para auditoria
        envioStatus:
          type: ["string", "null"]
          enum: [aceito, enviado, entregue, lido, falhou, null]
          description: >-
            Entrega da resposta ao contato em canal externo; nulo no chat interno. "aceito" = o Hablla
            colocou na fila (não é entrega). Com várias partes, vale a pior: falhou, ou o estágio mais atrasado.
        envioErro: { type: ["string", "null"] }
        authorUserId: { type: ["integer", "null"], description: "Staff member who wrote it (role staff) or sent the opening template" }
        authorName: { type: ["string", "null"] }
        kind:
          type: ["string", "null"]
          enum: [modelo_abertura, anexo, aviso_anexo, null]
          description: >-
            modelo_abertura = the WhatsApp opening template sent by staff; anexo = message that carries one file
            (the caption is in content); aviso_anexo = Sofia's fixed sentence after a received file
        anexo:
          oneOf:
            - $ref: "#/components/schemas/MessageAttachment"
            - type: "null"
        createdAt: { type: string }

    MessageAttachment:
      type: object
      required: [id, tipo, direcao, nome, mimeType, tamanhoBytes, copia, motivo, naoVisto, podeRecopiar]
      properties:
        id: { type: integer }
        tipo: { type: string, enum: [image, video, audio, document] }
        direcao: { type: string, enum: [recebido, enviado] }
        nome: { type: ["string", "null"] }
        mimeType: { type: ["string", "null"] }
        tamanhoBytes: { type: ["integer", "null"] }
        copia:
          type: string
          enum: [pendente, copiado, indisponivel, recusado]
          description: Só "copiado" tem arquivo para abrir. Uma cópia interrompida há muito tempo aparece como indisponivel.
        motivo: { type: ["string", "null"], description: "Código do motivo de recusa ou indisponibilidade (a tela traduz)" }
        naoVisto: { type: boolean, description: "Arquivo recebido que ninguém da equipe abriu ainda" }
        podeRecopiar: { type: boolean }

    ChatMessageInput:
      type: object
      required: [message]
      properties:
        message: { type: string }
        conversationId: { type: ["integer", "null"] }
        pessoaNome: { type: ["string", "null"], description: "Nome real da pessoa. Sem nome não há ficha criada nem reconhecida." }
        pessoaCelular: { type: ["string", "null"] }
        pessoaId: { type: ["integer", "null"] }

    SofiaChatStreamEvent:
      type: object
      description: Um evento SSE do POST /sofia/chat.
      properties:
        content: { type: string, description: "Pedaço do texto da resposta." }
        done: { type: boolean }
        conversationId: { type: integer }
        handoffTriggered: { type: boolean }
        handoffReason: { type: string }
        handoffSummary: { type: object, additionalProperties: true }
        handoffActive: { type: boolean, description: "A conversa já estava em handoff; a Sofia não respondeu." }
        handoffStatus: { type: string }
        error: { type: string }
        code: { type: string, enum: [SOFIA_COMPLETION_FAILED] }

    CanalInstagram:
      type: object
      required: [respondeAtivo, tokenConfigurado, tokenGeradoEm, webhookUrl, credenciaisHabllaConfiguradas]
      properties:
        respondeAtivo: { type: boolean, description: "A Sofia responde as DMs do Instagram (desligado por padrão)" }
        tokenConfigurado: { type: boolean }
        tokenGeradoEm: { type: ["string", "null"] }
        webhookUrl: { type: ["string", "null"], description: "Endereço a colar no Hablla; nulo quando o domínio público não é conhecido" }
        credenciaisHabllaConfiguradas: { type: boolean, description: "Token da API, workspace e ID da conexão de Instagram presentes no ambiente (não prova que são válidos; veja a verificação)" }

    HabllaVerificacao:
      type: object
      required: [token, conexoes, conexoesNoWorkspace]
      properties:
        token:
          type: string
          enum: [ok, sem_credenciais, recusado, workspace_diferente, indisponivel]
          description: "recusado = o Hablla não aceitou o token neste workspace (token errado ou de outro workspace)"
        conexoes:
          type: object
          required: [instagram, whatsapp]
          properties:
            instagram: { $ref: "#/components/schemas/HabllaVerificacaoConexao" }
            whatsapp: { $ref: "#/components/schemas/HabllaVerificacaoConexao" }
        conexoesNoWorkspace:
          type: array
          items:
            type: object
            required: [nome, tipo]
            properties:
              nome: { type: string }
              tipo: { type: ["string", "null"] }

    HabllaVerificacaoConexao:
      type: object
      required: [estado, nome]
      properties:
        estado:
          type: string
          enum: [ok, nao_configurada, nao_verificada, nao_encontrada, tipo_errado, inativa, indisponivel]
        nome: { type: ["string", "null"], description: "Nome da conexão no Hablla quando confirmada" }
        numeroDeTeste: { type: boolean, description: "Só no WhatsApp: a conexão usa um número de teste da Meta. Ausente quando a conexão não informa o nome do negócio" }

    CanalInstagramUpdate:
      type: object
      required: [respondeAtivo]
      properties:
        respondeAtivo: { type: boolean }

    CanalInstagramErro:
      type: object
      required: [error]
      properties:
        error: { type: string }

    CanalInstagramToken:
      type: object
      required: [token, geradoEm]
      properties:
        token: { type: string }
        geradoEm: { type: string }

    CanalInstagramEvento:
      type: object
      required: [id, createdAt, status, motivo, tipoEvento, conversationId, usuario, texto]
      properties:
        id: { type: integer }
        createdAt: { type: string }
        status: { type: string, enum: [recebido, respondido, ignorado, falhou] }
        motivo: { type: ["string", "null"] }
        tipoEvento: { type: ["string", "null"] }
        conversationId: { type: ["integer", "null"] }
        usuario: { type: ["string", "null"] }
        texto: { type: ["string", "null"], description: "Texto reconhecido na mensagem, truncado" }

    CanalWhatsapp:
      type: object
      required: [respondeAtivo, iniciaConversaAtivo, limiteIniciosPorHora, limiteIniciosPorDia, tokenConfigurado, tokenGeradoEm, webhookUrl, credenciaisHabllaConfiguradas, ultimaFalhaDeEnvio]
      properties:
        respondeAtivo: { type: boolean, description: "A Sofia responde as mensagens do WhatsApp (desligado por padrão, independente do Instagram)" }
        iniciaConversaAtivo: { type: boolean, description: "A Sofia manda o modelo de abertura a quem preenche o formulário de interesse e marcou o consentimento (desligado por padrão)" }
        limiteIniciosPorHora: { type: integer, description: "Máximo de primeiros contatos automáticos por hora" }
        limiteIniciosPorDia: { type: integer, description: "Máximo de primeiros contatos automáticos por dia" }
        tokenConfigurado: { type: boolean }
        tokenGeradoEm: { type: ["string", "null"] }
        webhookUrl: { type: ["string", "null"], description: "Endereço a colar no Hablla; nulo quando o domínio público não é conhecido" }
        credenciaisHabllaConfiguradas: { type: boolean, description: "Token da API, workspace e ID da conexão de WhatsApp presentes no ambiente (não prova que são válidos; veja a verificação)" }
        ultimaFalhaDeEnvio:
          description: Preenchido quando o envio mais recente pelo WhatsApp falhou; nulo quando foi aceito ou entregue. Traz só a data e o código da Meta, nunca texto do provedor, telefone ou conteúdo de mensagem.
          anyOf:
            - $ref: "#/components/schemas/UltimaFalhaDeEnvio"
            - type: "null"

    UltimaFalhaDeEnvio:
      type: object
      required: [falhouEm, codigo]
      properties:
        falhouEm: { type: string, description: "Quando a falha foi registrada (ISO 8601)" }
        codigo: { type: ["integer", "null"], description: "Código de erro da Meta quando o erro guardado traz um; nulo caso contrário" }

    CanalWhatsappUpdate:
      type: object
      description: Pelo menos um dos campos precisa vir.
      properties:
        respondeAtivo: { type: boolean }
        iniciaConversaAtivo: { type: boolean }

    CanalWhatsappEvento:
      type: object
      required: [id, createdAt, status, motivo, tipoEvento, conversationId, telefone, texto, falha]
      properties:
        id: { type: integer }
        createdAt: { type: string }
        status: { type: string, enum: [recebido, respondido, ignorado, falhou] }
        motivo: { type: ["string", "null"] }
        tipoEvento: { type: ["string", "null"] }
        conversationId: { type: ["integer", "null"] }
        telefone: { type: ["string", "null"], description: "Telefone do remetente, só dígitos com código do país" }
        texto: { type: ["string", "null"], description: "Texto da mensagem, truncado" }
        falha: { type: ["string", "null"], description: "Motivo da falha de envio em português, traduzido do código da Meta; nulo quando o evento não é uma falha" }

    PessoaConversation:
      type: object
      required: [id, title, model, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        model: { type: string }
        createdAt: { type: string }

