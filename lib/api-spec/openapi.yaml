        intencaoPrincipal: { type: ["string", "null"] }
        temperatura: { type: ["string", "null"] }
        estiloCognitivo: { type: ["string", "null"] }
        velocidadeEvolucao: { type: ["string", "null"] }
        preferredLanguage: { type: ["string", "null"] }
        consentStatus: { type: ["string", "null"] }
        numeroRef: { type: ["integer", "null"] }
        dataRegistro: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        conversationCount: { type: integer }

    PessoaNote:
      type: object
      required: [id, pessoaId, noteType, value, body, createdBy, createdAt]
      properties:
        id: { type: integer }
        pessoaId: { type: integer }
        sourcePessoaId: { type: ["integer", "null"] }
        noteType: { type: string }
        contactType: { type: ["string", "null"], enum: [email, phone, null] }
        value: { type: string }
        body: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    PessoaMergeInput:
      type: object
      additionalProperties: false
      required: [sourceId, nameFrom, emailFrom, phoneFrom, reason]
      properties:
        sourceId: { type: integer }
        nameFrom: { type: string, enum: [target, source] }
        emailFrom: { type: string, enum: [target, source] }
        phoneFrom: { type: string, enum: [target, source] }
        fieldChoices:
          type: object
          additionalProperties: { type: string, enum: [target, source] }
        reason: { type: string, minLength: 1 }

    PessoaMergePreview:
      type: object
      required: [target, source, defaults, relationshipCounts, collisionCounts, fieldConflicts, secondaryContacts]
      properties:
        target: { $ref: "#/components/schemas/PessoaMergeSummary" }
        source: { $ref: "#/components/schemas/PessoaMergeSummary" }
        defaults:
          type: object
          required: [nameFrom, emailFrom, phoneFrom]
          properties:
            nameFrom: { type: string, enum: [target, source] }
            emailFrom: { type: string, enum: [target, source] }
            phoneFrom: { type: string, enum: [target, source] }
        relationshipCounts:
          type: object
          required: [target, source]
          properties:
            target: { type: object, additionalProperties: { type: integer } }
            source: { type: object, additionalProperties: { type: integer } }
        collisionCounts: { type: object, additionalProperties: { type: integer } }
        fieldConflicts:
          type: array
          items:
            type: object
            required: [field, targetValue, sourceValue, defaultFrom]
            properties:
              field: { type: string }
              targetValue: {}
              sourceValue: {}
              defaultFrom: { type: string, enum: [target, source] }
        secondaryContacts:
          type: array
          items:
            type: object
            required: [type, value, sourcePessoaId]
            properties:
              type: { type: string, enum: [email, phone] }
              value: { type: string }
              sourcePessoaId: { type: integer }

