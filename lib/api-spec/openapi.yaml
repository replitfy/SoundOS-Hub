openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SoundOS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard & KPIs
  - name: store
    description: Store / E-commerce
  - name: education
    description: Education / School
  - name: sofia
    description: Sofia AI
  - name: admin
    description: Administration
  - name: pessoas
    description: Pessoas / Leads
  - name: commercial
    description: Commercial CRM opportunities Kanban

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Dashboard ────────────────────────────────────────────────
  /dashboard/kpis:
    get:
      operationId: getDashboardKpis
      tags: [dashboard]
      summary: Get dashboard KPIs
      responses:
        "200":
          description: KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardKpis"

  /dashboard/orders-chart:
    get:
      operationId: getOrdersChart
      tags: [dashboard]
      summary: Daily orders chart data
      parameters:
        - in: query
          name: period
          schema: { type: string }
      responses:
        "200":
          description: Chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartPoint"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Pending action alerts
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /dashboard/finance-summary:
    get:
      operationId: getFinanceSummary
      tags: [dashboard]
      summary: Financial summary metrics
      responses:
        "200":
          description: Finance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceSummary"

  /dashboard/snapshot:
    get:
      operationId: getDashboardSnapshot
      tags: [dashboard]
      summary: Get the latest persisted dashboard snapshot without refreshing sources
      responses:
        "200":
          description: Latest dashboard snapshot, or an empty state before the first refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"

  /dashboard/snapshot/refresh:
    post:
      operationId: refreshDashboardSnapshot
      tags: [dashboard]
      summary: Refresh all dashboard sources and persist one consistent snapshot
      responses:
        "200":
          description: Refreshed snapshot, or the previous snapshot with an error status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"

  /dashboard/commercial-pipeline:
    get:
      operationId: getCommercialPipeline
      tags: [dashboard]
      summary: Commercial pipeline by course
      responses:
        "200":
          description: Pipeline data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercialPipeline"

  # ── Store ─────────────────────────────────────────────────────
  /store/panel:
    get:
      operationId: getStorePanel
      tags: [store]
      summary: Painel Loja computed from the last persisted snapshot of real Wix orders
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: ["30d", "90d", "12m", all]
            default: "12m"
        - in: query
          name: situation
          schema:
            $ref: "#/components/schemas/StoreSituation"
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: dataDe
          description: Inclusive start date in America/Sao_Paulo; overrides the period start when provided.
          schema: { type: string, format: date }
        - in: query
          name: dataAte
          description: Inclusive end date in America/Sao_Paulo; overrides the period end when provided.
          schema: { type: string, format: date }
        - in: query
          name: product
          description: Product key returned in StorePanelData.productOptions.
          schema: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Panel data for the selected period, or an empty state before the first load
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePanelResponse"

  /store/panel/orders/{orderId}:
    get:
      operationId: getStorePanelOrder
      tags: [store]
      summary: Detail of one order from the last persisted snapshot (never calls Wix); ficha link only for users with the Pessoas area
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order detail, with the live link to a ficha when the user may see Pessoas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderDetail"
        "404":
          description: Order is not in the saved snapshot

  /store/panel/refresh:
    post:
      operationId: refreshStorePanel
      tags: [store]
      summary: Read all orders from Wix again and persist them (automatic runs at most once per day)
      parameters:
        - in: query
          name: trigger
          schema:
            type: string
            enum: [manual, automatic]
            default: manual
      responses:
        "200":
          description: Snapshot state after the attempt; a failure keeps the previous orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorePanelStatus"

  /store/orders:
    get:
      operationId: listOrders
      tags: [store]
      summary: List orders
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: offset
          schema: { type: integer }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /store/products:
    get:
      operationId: listProducts
      tags: [store]
      summary: List published Wix products enriched with Omie Store inventory
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Published Wix catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCatalogResponse"

  /store/products/incomplete-export:
    get:
      operationId: exportIncompleteProducts
      tags: [store]
      summary: Export published Wix products missing a photo or official description
      responses:
        "200":
          description: XLSX report of published products with catalog completeness pendencies
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /store/customers:
    get:
      operationId: listStoreCustomers
      tags: [store]
      summary: List store customers
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreCustomer"

  # ── Education ─────────────────────────────────────────────────
  /education/kpis:
    get:
      operationId: getEducationKpis
      tags: [education]
      summary: Education KPIs
      responses:
        "200":
          description: Education KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EducationKpis"

  /education/courses:
    get:
      operationId: listCourses
      tags: [education]
      summary: List courses
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [education]
      summary: Create course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"

  /education/courses/{id}:
    patch:
      operationId: updateCourse
      tags: [education]
      summary: Update course
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
    delete:
      operationId: deleteCourse
      tags: [education]
      summary: Delete course
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /education/classes:
    get:
      operationId: listClasses
      tags: [education]
      summary: List classes (turmas)
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
    post:
      operationId: createClass
      tags: [education]
      summary: Create class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"

  /education/students:
    get:
      operationId: listStudents
      tags: [education]
      summary: List students (pessoas matriculadas em alguma turma)
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"

  /education/pessoa-options:
    get:
      operationId: listPessoaOptions
      tags: [education]
      summary: Pessoas do CRM para escolher ao matricular
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Pessoa options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PessoaOption"

  /education/enrollments:
    get:
      operationId: listEnrollments
      tags: [education]
      summary: List enrollments
      parameters:
        - in: query
          name: classId
          schema: { type: integer }
      responses:
        "200":
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrollment"
    post:
      operationId: createEnrollment
      tags: [education]
      summary: Create enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /education/enrollments/{id}:
    patch:
      operationId: updateEnrollment
      tags: [education]
      summary: Update enrollment status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrollment"

  /education/calendar:
    get:
      operationId: getCalendarEvents
      tags: [education]
      summary: Calendar events
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"

  # ── Sofia ─────────────────────────────────────────────────────
  /sofia/knowledge:
    get:
      operationId: listKnowledgeItems
      tags: [sofia]
      summary: List knowledge base items
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeItem"
    post:
      operationId: createKnowledgeItem
      tags: [sofia]
      summary: Add knowledge item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"

  /sofia/knowledge/upload:
    post:
      operationId: uploadKnowledgeDocument
      tags: [sofia]
      summary: Upload a document to the knowledge base
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/KnowledgeUploadRequest"
      responses:
        "202":
          description: Accepted — processing in background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"
        "200":
          description: Duplicate detected — returning existing item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"
        "400":
          description: Invalid file type or missing file

  /sofia/knowledge/search:
    get:
      operationId: searchKnowledge
      tags: [sofia]
      summary: Multi-query full-text search over knowledge chunks, fused by RRF
      description: >
        The query is expanded into alternative phrasings by a lightweight model; each
        runs its own BM25 search and the rankings are fused with Reciprocal Rank Fusion.
        Falls back to a single plain BM25 search when the expansion is unavailable.
        The vector half of the hybrid search activates automatically once chunks have
        embeddings.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeSearchResult"

  /sofia/knowledge/{id}:
    delete:
      operationId: deleteKnowledgeItem
      tags: [sofia]
      summary: Delete knowledge item
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /sofia/prompts:
    get:
      operationId: listPrompts
      tags: [sofia]
      summary: List prompt versions
      responses:
        "200":
          description: Prompts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"
    post:
      operationId: createPrompt
      tags: [sofia]
      summary: Save new prompt version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"

  /sofia/prompts/{id}/activate:
    post:
      operationId: activatePrompt
      tags: [sofia]
      summary: Set prompt as active
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prompt"
        "503":
          description: Selected model is temporarily unavailable
          content:
            application/json:
              schema:
                type: object
                required: [code, error]
                properties:
                  code:
                    type: string
                    enum: [SOFIA_MODEL_UNAVAILABLE]
                  error:
                    type: string

  /sofia/conduta:
    get:
      operationId: getCondutaConfig
      tags: [sofia]
      summary: Get commercial conduct rules (triagem/comercial blocks)
      responses:
        "200":
          description: Conduta config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CondutaConfig"
    put:
      operationId: updateCondutaConfig
      tags: [sofia]
      summary: Update commercial conduct rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CondutaConfigUpdate"
      responses:
        "200":
          description: Updated conduta config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CondutaConfig"
  /sofia/entity-registry:
    get:
      operationId: listSofiaEntityRegistry
      tags: [sofia]
      summary: List canonical Sofia entities and governance coverage
      responses:
        "200":
          description: Registry
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SofiaEntity" }
  /sofia/entity-registry/readiness:
    get:
      operationId: getSofiaEntityRegistryReadiness
      tags: [sofia]
      summary: Readiness status for enabling Sofia factual fast-path
      responses:
        "200":
          description: Readiness summary
          content:
            application/json:
              schema:
                type: object
                required: [ready, approvedCount, gaps]
                properties:
                  ready: { type: boolean }
                  approvedCount: { type: integer }
                  gaps: { type: array, items: { type: string } }
  /sofia/entity-registry/{id}:
    patch:
      operationId: updateSofiaEntityRegistry
      tags: [sofia]
      summary: Update factual approval, sensitivity or capabilities
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SofiaEntityUpdate" }
      responses:
        "200":
          description: Updated entity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SofiaEntity" }
  /sofia/canais/instagram:
    get:
      operationId: getCanalInstagram
      tags: [sofia]
      summary: Estado do canal Instagram (Hablla) da Sofia
      responses:
        "200":
          description: Estado do canal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanalInstagram"
    put:
      operationId: updateCanalInstagram
      tags: [sofia]
      summary: Liga ou desliga a resposta automática da Sofia no Instagram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanalInstagramUpdate"
      responses:
        "200":
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanalInstagram"
        "409":
          description: Faltam token do webhook ou credenciais da API do Hablla para ligar a resposta automática
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanalInstagramErro"
  /sofia/canais/instagram/token:
    post:
      operationId: gerarTokenWebhookInstagram
      tags: [sofia]
      summary: Gera um novo token para o webhook do Hablla (mostrado uma única vez; invalida o anterior)
      responses:
        "200":
          description: Token gerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanalInstagramToken"
  /sofia/canais/hablla/verificacao:
    get:
      operationId: verificarCredenciaisHablla
      tags: [sofia]
      summary: Confere, só com leituras, se o token e as conexões do Hablla (Astenir) estão corretos
      responses:
        "200":
          description: Resultado da verificação (somente estados e nomes de exibição, sem segredos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabllaVerificacao"
  /sofia/canais/instagram/eventos:
    get:
      operationId: listEventosCanalInstagram
      tags: [sofia]
      summary: Últimos eventos recebidos do Hablla e o que foi feito com cada um
      responses:
        "200":
          description: Eventos recentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanalInstagramEvento"
  /sofia/canais/whatsapp:
    get:
      operationId: getCanalWhatsapp
      tags: [sofia]
      summary: Estado do canal WhatsApp (Hablla) da Sofia
      responses:
        "200":
          description: Estado do canal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanalWhatsapp"
    put:
      operationId: updateCanalWhatsapp
      tags: [sofia]
      summary: Liga ou desliga a resposta automática da Sofia no WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanalWhatsappUpdate"
      responses:
        "200":
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanalWhatsapp"
        "409":
          description: Faltam token do webhook ou credenciais da API do Hablla para ligar a resposta automática
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanalInstagramErro"
  /sofia/canais/whatsapp/token:
    post:
      operationId: gerarTokenWebhookWhatsapp
      tags: [sofia]
      summary: Gera um novo token para o webhook do WhatsApp no Hablla (mostrado uma única vez; invalida o anterior)
      responses:
        "200":
          description: Token gerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanalInstagramToken"
  /sofia/canais/whatsapp/eventos:
    get:
      operationId: listEventosCanalWhatsapp
      tags: [sofia]
      summary: Últimos eventos do WhatsApp recebidos do Hablla e o que foi feito com cada um
      responses:
        "200":
          description: Eventos recentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanalWhatsappEvento"
  /sofia/conversations:
    get:
      operationId: listConversations
      tags: [sofia]
      summary: List conversations / handoffs
      parameters:
        - in: query
          name: includeHidden
          schema: { type: string, enum: ["true", "false"] }
          description: Inclui conversas ocultas; por padrão retorna apenas as visíveis.
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [sofia]
      summary: Create a new conversation session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /sofia/conversations/awaiting-staff:
    get:
      operationId: listConversationsAwaitingStaff
      tags: [sofia]
      summary: Conversas do WhatsApp e do Instagram que aguardam a equipe (alimenta o aviso no menu)
      description: >-
        Conversas de canais externos em "aguardando_humano" e conversas de WhatsApp com arquivo recebido que
        ninguém da equipe viu ainda (qualquer status). Cada conversa conta uma vez. Sai da contagem assim que
        alguém assume ou resolve (handoff) ou abre a conversa (arquivos). O chat interno do SoundOS não entra.
      responses:
        "200":
          description: Contagem e as conversas mais recentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AwaitingStaffSummary"

  /sofia/conversations/{id}:
    get:
      operationId: getConversation
      tags: [sofia]
      summary: Get a single conversation, including handoff status/summary
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Conversation not found

  /sofia/conversations/{id}/visibility:
    patch:
      operationId: updateConversationVisibility
      tags: [sofia]
      summary: Ocultar ou restaurar conversa sem apagar o histórico
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationVisibility"
      responses:
        "204": { description: Visibilidade atualizada }
        "400": { description: Parâmetros inválidos }
        "404": { description: Conversa não encontrada }

  /sofia/conversations/{id}/messages:
    get:
      operationId: listConversationMessages
      tags: [sofia]
      summary: Get all messages for a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /sofia/conversations/{id}/anexos/vistos:
    post:
      operationId: markConversationAttachmentsSeen
      tags: [sofia]
      summary: A equipe abriu a conversa; os arquivos recebidos passam a vistos (exige a área Conversas)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: "Marcados" }
        "403": { description: "Falta a área Conversas (CHAT_FORBIDDEN)" }

  /anexos/{id}/arquivo:
    get:
      operationId: getAttachmentFile
      tags: [sofia]
      summary: Arquivo de um anexo do WhatsApp (só a equipe com a área Conversas; aceita Range)
      description: >-
        Não existe endereço público. A tela busca com a sessão e mostra a partir de um blob. Só imagem, vídeo e áudio
        de tipos conhecidos saem como "inline"; o resto é download. Cabeçalhos: nosniff, CSP restritiva, sem cache.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Conteúdo do arquivo
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206": { description: "Parte do arquivo (Range)" }
        "403": { description: "Falta a área Conversas (ATTACHMENT_FORBIDDEN)" }
        "404": { description: "Arquivo inexistente ou ainda não copiado (ATTACHMENT_UNAVAILABLE)" }
        "416": { description: "Intervalo inválido" }

  /anexos/{id}/recopiar:
    post:
      operationId: retryAttachmentCopy
      tags: [sofia]
      summary: Nova tentativa de copiar um arquivo recebido que ficou indisponível (não envia nada à pessoa)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Resultado da nova tentativa
          content:
            application/json:
              schema:
                type: object
                required: [copia]
                properties:
                  copia: { type: string, enum: [pendente, copiado, indisponivel, recusado] }
        "409": { description: "O arquivo não pode ser copiado de novo (ATTACHMENT_NOT_RETRYABLE)" }

  /sofia/conversations/{id}/decision-runs:
    get:
      operationId: listConversationDecisionRuns
      tags: [sofia]
      summary: Log do motor cognitivo — decisões auditáveis tomadas nesta conversa
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Decision runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DecisionRun"

  /sofia/conversations/{id}/handoff/assume:
    post:
      operationId: assumeConversationHandoff
      tags: [sofia]
      summary: Um humano assume uma conversa aguardando handoff
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Conversation not found

  /sofia/conversations/{id}/handoff/resolve:
    post:
      operationId: resolveConversationHandoff
      tags: [sofia]
      summary: Um humano marca a conversa como resolvida, devolvendo o controle à Sofia
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Conversation not found

  /sofia/videos:
    get:
      operationId: listVideos
      tags: [sofia]
      summary: List video catalog (imported from Documento 12 spreadsheet)
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
    post:
      operationId: createVideo
      tags: [sofia]
      summary: Manually create a video catalog entry. If codigo is omitted/blank, the server generates a stable one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Invalid input (e.g. missing título, or código already in use)

  /sofia/videos/template:
    get:
      operationId: downloadVideoImportTemplate
      tags: [sofia]
      summary: Download a spreadsheet template for importing/updating the video catalog
      responses:
        "200":
          description: Template spreadsheet (.xlsx)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /sofia/videos/import:
    post:
      operationId: importVideos
      tags: [sofia]
      summary: Import/update the video catalog from an uploaded spreadsheet (.xlsx or .csv)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoImportResult"
        "400":
          description: Arquivo inválido ou colunas obrigatórias ausentes

  /sofia/videos/envios:
    get:
      operationId: listVideoEnvios
      tags: [sofia]
      summary: List videos Sofia actually sent to leads in real conversations (not just tool candidates — only what survived eligibility gates and appeared in the final reply)
      parameters:
        - in: query
          name: videoId
          schema: { type: integer }
          description: Filter to sends of a single video
        - in: query
          name: pessoaId
          schema: { type: integer }
          description: Filter to sends to a single pessoa/lead
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Video sends, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoEnvio"

  /sofia/videos/{id}:
    patch:
      operationId: updateVideo
      tags: [sofia]
      summary: Update a video catalog entry (any field, including approval toggle). Blank/omitted codigo keeps or generates a stable one — it is never left blank.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVideoInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Invalid input, cannot approve a video without a real link, or código already in use
        "404":
          description: Video not found
    delete:
      operationId: deleteVideo
      tags: [sofia]
      summary: Delete a video catalog entry
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Video not found

  /sofia/chat:
    post:
      operationId: sofiaChat
      tags: [sofia]
      summary: Send message to Sofia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: >
            Server-Sent Events. Cada evento `data:` traz um SofiaChatStreamEvent:
            pedaços de texto (`content`), o evento final (`done`) ou um erro (`error`/`code`).
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SofiaChatStreamEvent"

  # ── Pessoas (Leads) ───────────────────────────────────────────
  /pessoas:
    get:
      operationId: listPessoas
      tags: [pessoas]
      summary: List pessoas (leads)
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: celular
          schema: { type: string }
          description: Lookup by phone number (digits only, partial match)
        - in: query
          name: ativo
          schema: { type: string }
        - in: query
          name: arquivado
          schema: { type: string }
          description: Set to "true" to list only archived pessoas; archived records are excluded by default
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: offset
          schema: { type: integer }
      responses:
        "200":
          description: Pessoas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pessoa"
    post:
      operationId: createPessoa
      tags: [pessoas]
      summary: Create pessoa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PessoaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pessoa"

  /pessoas/batch/archive:
    post:
      operationId: batchArchivePessoas
      tags: [pessoas]
      summary: Atomically archive up to 100 pessoas
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PessoaBatchArchiveInput" }
      responses:
        "200":
          description: Archived pessoas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PessoaBatchArchiveResult" }
        "400": { description: "Invalid ids" }
        "409": { description: "A pessoa does not exist, is merged, or is already archived" }

  /pessoas/merge-candidates:
    get:
      operationId: listPessoaMergeCandidates
      tags: [pessoas]
      summary: Search active, inactive, and archived candidates for an admin merge
      parameters:
        - in: query
          name: search
          required: true
          schema: { type: string, minLength: 2 }
        - in: query
          name: excludeId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Unmerged candidate pessoas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PessoaMergeCandidate" }
        "400": { description: Invalid search }

  /pessoas/{id}:
    get:
      operationId: getPessoa
      tags: [pessoas]
      summary: Get pessoa by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Pessoa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pessoa"
    patch:
      operationId: updatePessoa
      tags: [pessoas]
      summary: Update pessoa
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PessoaUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pessoa"

  /pessoas/{id}/merge-preview:
    get:
      operationId: getPessoaMergePreview
      tags: [pessoas]
      summary: Preview a safe pessoa merge
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: sourceId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Merge preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PessoaMergePreview" }
        "404": { description: "Pessoa not found" }
        "409": { description: "Source is already merged" }

  /pessoas/{id}/merge:
    post:
      operationId: mergePessoa
      tags: [pessoas]
      summary: Merge a source pessoa into the target
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PessoaMergeInput" }
      responses:
        "200":
          description: Merge result (repeating the same source/target is idempotent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PessoaMergeResult" }
        "400": { description: Invalid merge request }
        "404": { description: "Pessoa not found" }
        "409": { description: "Merge conflict" }

  /pessoas/{id}/notes:
    get:
      operationId: listPessoaNotes
      tags: [pessoas]
      summary: List append-only notes for a pessoa
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PessoaNote" }
        "404": { description: "Pessoa not found" }

  /pessoas/{id}/evidencias:
    get:
      operationId: listPessoaEvidencias
      tags: [pessoas]
      summary: List append-only evidence history for a pessoa (audit trail)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Evidence history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PessoaEvidencia"

  /pessoas/{id}/decision-runs:
    get:
      operationId: listPessoaDecisionRuns
      tags: [pessoas]
      summary: List Sofia's decision engine audit history for a pessoa (evidence considered, eligibility, NBA)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Decision run history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DecisionRun"

  /pessoas/{id}/campos-status:
    get:
      operationId: getPessoaCamposStatus
      tags: [pessoas]
      summary: List fields confirmed by a human and any pending Sofia suggestion diverging from the official value
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Field confirmation status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PessoaCampoStatus"

  /pessoas/{id}/conversations:
    get:
      operationId: listPessoaConversations
      tags: [pessoas]
      summary: List conversations for a pessoa
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PessoaConversation"
        "404":
          description: Pessoa not found

  /pessoas/{id}/inativar:
    patch:
      operationId: inativarPessoa
      tags: [pessoas]
      summary: Inativar pessoa
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Inativada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pessoa"

  /pessoas/{id}/reativar:
    patch:
      operationId: reativarPessoa
      tags: [pessoas]
      summary: Reativar pessoa
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reativada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pessoa"

  /pessoas/{id}/arquivar:
    patch:
      operationId: arquivarPessoa
      tags: [pessoas]
      summary: Archive a pessoa without deleting linked history
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pessoa"
        "404":
          description: Pessoa not found

  /pessoas/{id}/restaurar:
    patch:
      operationId: restaurarPessoa
      tags: [pessoas]
      summary: Restore an archived pessoa
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pessoa"
        "404":
          description: Pessoa not found

  # ── Admin ─────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [admin]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/users/bulk-delete:
    post:
      operationId: bulkDeleteUsers
      tags: [admin]
      summary: Deactivate multiple users atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserBulkDeleteInput"
      responses:
        "200":
          description: Deactivated users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{id}:
    put:
      operationId: updateUser
      tags: [admin]
      summary: Update user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Deactivate user (soft delete)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/me:
    get:
      operationId: getMyAccess
      tags: [admin]
      summary: Access (profile and allowed menu areas) of the signed-in user
      responses:
        "200":
          description: Current access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAccess"

  /admin/access-profiles:
    get:
      operationId: listAccessProfiles
      tags: [admin]
      summary: List access profiles
      responses:
        "200":
          description: Access profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessProfile"
    post:
      operationId: createAccessProfile
      tags: [admin]
      summary: Create access profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessProfile"

  /admin/access-profiles/{id}:
    put:
      operationId: updateAccessProfile
      tags: [admin]
      summary: Update access profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessProfile"
    delete:
      operationId: deleteAccessProfile
      tags: [admin]
      summary: Delete access profile (blocked for system profiles and profiles in use)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /admin/airtable-carga:
    get:
      operationId: getAirtableCarga
      tags: [admin]
      summary: Airtable new-clients load — settings and the latest runs (previews and loads)
      responses:
        "200":
          description: Settings and latest runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirtableCargaState"

  /admin/airtable-carga/previews:
    post:
      operationId: startAirtableCargaPreview
      tags: [admin]
      summary: Start a read-only preview in the background (writes nothing to people)
      responses:
        "202":
          description: Preview registered and running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirtableCargaRun"
        "409":
          description: Another run is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirtableCargaError"

  /admin/airtable-carga/loads:
    post:
      operationId: startAirtableCargaLoad
      tags: [admin]
      summary: Start the load of new clients, based on a recent preview, in the background
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AirtableCargaLoadInput"
      responses:
        "202":
          description: Load registered and running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirtableCargaRun"
        "400":
          description: Missing confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirtableCargaError"
        "404":
          description: Preview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirtableCargaError"
        "409":
          description: Preview unusable or another run in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirtableCargaError"

  /admin/connectors:
    get:
      operationId: listConnectors
      tags: [admin]
      summary: List integration connectors
      responses:
        "200":
          description: Connectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connector"

  /admin/omie/status:
    get:
      operationId: getOmieStatus
      tags: [admin]
      summary: Connection status of both Omie ERP bases
      security:
        - userId: []
      responses:
        "200":
          description: Status of each Omie base
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OmieBaseStatus"
        "401":
          description: Unauthorized

  /admin/omie/{base}/clientes:
    get:
      operationId: listOmieClientes
      tags: [admin]
      summary: List clients from an Omie base
      security:
        - userId: []
      parameters:
        - in: path
