        cacau: { type: ["string", "null"] }
        ayahuasca: { type: ["string", "null"] }
        concerto: { type: ["string", "null"] }
        zapPierre: { type: ["string", "null"] }
        idAlunoCliente: { type: ["string", "null"] }
        turma: { type: ["string", "null"] }
        conectadoProposito: { type: ["string", "null"] }
        buscaEspiritual: { type: ["string", "null"] }
