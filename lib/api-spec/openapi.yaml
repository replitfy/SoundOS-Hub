        dataNascimento: { type: ["string", "null"] }
        sexo: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        celular: { type: ["string", "null"] }
        instagram: { type: ["string", "null"] }
        site: { type: ["string", "null"] }
        profissao: { type: ["string", "null"] }
