        problemaSaude: { type: ["string", "null"] }
        psicoterapiaPsiquiatria: { type: ["string", "null"] }
        sensacao: { type: ["string", "null"] }
        sensacaoPerseguido: { type: ["string", "null"] }
        covid: { type: ["string", "null"] }
        comprovanteCovid: { type: ["string", "null"] }
        perfilPrincipal: { type: ["string", "null"] }
