      type: object
      required: [previewRunId, restoreConfirmed]
      properties:
        previewRunId: { type: integer }
        restoreConfirmed:
          type: boolean
          description: The person confirms they checked point-in-time recovery of the production database.

    AirtableCargaReviewReasons:
      type: object
      required: [duplicado_no_airtable, ambiguo, contraditorio, dados_insuficientes]
      properties:
        duplicado_no_airtable: { type: integer }
        ambiguo: { type: integer }
        contraditorio: { type: integer }
        dados_insuficientes: { type: integer }

    AirtableCargaEnrollmentReviewReasons:
      type: object
      required: [turma_ausente, turma_ambigua, duplicada, pessoa_ambigua]
      properties:
        turma_ausente: { type: integer }
        turma_ambigua: { type: integer }
        duplicada: { type: integer }
        pessoa_ambigua: { type: integer }

    AirtableCargaEnrollmentTotals:
      type: object
      description: Totals only; enrollments of the new clients into classes that already exist (never creates classes or courses).
      required: [sourceRecords, eventRecords, forNewClients, toCreate, clientsWithEnrollment, review]
      properties:
        sourceRecords: { type: integer, description: Enrollment rows read from Airtable. }
        eventRecords: { type: integer, description: Event rows read from Airtable (both event tables). }
        forNewClients: { type: integer, description: Enrollment rows that belong to clients this load creates. }
        toCreate: { type: integer }
        clientsWithEnrollment: { type: integer }
        review:
          type: object
          required: [total, byReason]
          properties:
            total: { type: integer }
            byReason:
              $ref: "#/components/schemas/AirtableCargaEnrollmentReviewReasons"

    AirtableCargaTotals:
      type: object
      required: [sourceRecords, toCreate, alreadyExist, alreadyExistBy, review, enrollments]
      properties:
        sourceRecords: { type: integer }
        toCreate: { type: integer }
        alreadyExist: { type: integer }
        alreadyExistBy:
          type: object
          required: [email, phone, both, previousLoad]
          properties:
            email: { type: integer }
            phone: { type: integer }
            both: { type: integer }
            previousLoad: { type: integer }
        review:
          type: object
          required: [total, byReason]
          properties:
            total: { type: integer }
            byReason:
              $ref: "#/components/schemas/AirtableCargaReviewReasons"
        enrollments:
          description: Null on previews created before enrollments were included.
          allOf:
            - $ref: "#/components/schemas/AirtableCargaEnrollmentTotals"
          nullable: true

    AirtableCargaCheck:
      type: object
      required: [name, ok]
      properties:
        name: { type: string }
        ok: { type: boolean }

    AirtableCargaRun:
      type: object
      required:
        - id
        - kind
        - status
        - step
        - startedAt
        - finishedAt
        - requestedBy
        - previewRunId
        - errorCode
        - sourceRecordsRead
        - totals
        - minimumExpected
        - created
        - enrollmentsCreated
        - reconciliation
        - usableForLoad
        - validUntil
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [preview, load]
        status:
          type: string
          enum: [running, completed, failed]
        step: { type: [string, "null"] }
        startedAt: { type: string }
        finishedAt: { type: [string, "null"] }
        requestedBy:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: [string, "null"] }
        previewRunId: { type: [integer, "null"] }
        errorCode: { type: [string, "null"] }
        sourceRecordsRead: { type: [integer, "null"] }
        totals:
          allOf:
            - $ref: "#/components/schemas/AirtableCargaTotals"
          nullable: true
        minimumExpected: { type: [integer, "null"] }
        created: { type: [integer, "null"] }
        enrollmentsCreated: { type: [integer, "null"] }
        reconciliation:
          type: [object, "null"]
          required: [passed, checks]
          properties:
            passed: { type: boolean }
            checks:
              type: array
              items:
                $ref: "#/components/schemas/AirtableCargaCheck"
        usableForLoad: { type: boolean }
        validUntil: { type: [string, "null"] }

    AirtableCargaState:
      type: object
      required: [runs, settings]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/AirtableCargaRun"
        settings:
          type: object
          required: [previewValidMinutes, referenceRecords, minimumFraction]
          properties:
            previewValidMinutes: { type: integer }
            referenceRecords: { type: integer }
            minimumFraction: { type: number }

