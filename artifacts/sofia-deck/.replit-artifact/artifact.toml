kind = "slides"
previewPath = "/sofia-deck/"
title = "Sofia — Funcionalidades"
version = "1.0.0"
id = "artifacts/sofia-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/sofia-deck/" ]
localPort = 18983

[services.development]
run = "pnpm --filter @workspace/sofia-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sofia-deck", "run", "build" ]
publicDir = "artifacts/sofia-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18983"
BASE_PATH = "/sofia-deck/"
